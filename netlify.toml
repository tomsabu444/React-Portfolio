[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache hashed assets for 1 year (forever, since filename changes on updates)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML - always check for updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache images/favicon
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"